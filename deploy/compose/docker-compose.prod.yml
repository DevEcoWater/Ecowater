# Project name = CLIENT_SLUG, declared below so it travels with this file.
# It used to live here as `name: ecowater`; 19245b8 traded it for a comment
# asking to set COMPOSE_PROJECT_NAME in .env.production, nobody did, and every
# later deploy resolved the project from this file's directory ("compose")
# instead — colliding with the containers already running under "ecowater".
name: ${CLIENT_SLUG:-ecowater}

# Each client gets its own slug (e.g. "aquacoop-norte") so container/volume
# names are scoped per client on the same host, if ever needed.
# Safe on separate VPS — the default slug "ecowater" keeps backward compat.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${CLIENT_SLUG:-ecowater}-postgres
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Bound to loopback on purpose: Postgres is NOT reachable from the internet.
    # Developers read production through an SSH tunnel — see
    # deploy/docs/DB_READONLY_ACCESS.md. Never widen this to 0.0.0.0.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - client_net

  mqtt:
    image: eclipse-mosquitto:2
    container_name: ${CLIENT_SLUG:-ecowater}-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ../mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ../mqtt/config/passwords:/mosquitto/config/passwords
      - ../mqtt/config/certs:/mosquitto/config/certs
      - ../mqtt/data:/mosquitto/data
      - ../mqtt/log:/mosquitto/log
    networks:
      - client_net

  app:
    container_name: ${CLIENT_SLUG:-ecowater}-app
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        # NEXT_PUBLIC_NAME removed — brand name is committed in config/client.config.ts
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID}
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - client_net

volumes:
  postgres_data:

networks:
  client_net:
    driver: bridge
