name: ecowater

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecowater-postgres
    restart: unless-stopped
    env_file:
      - ../env/.env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ecowater_net

  app:
    container_name: ecowater-app
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    env_file:
      - ../env/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ecowater_net

  mqtt:
    image: eclipse-mosquitto:2
    container_name: ecowater-mqtt
    restart: unless-stopped
    volumes:
      - /var/www/ecowater/mqtt/config:/mosquitto/config
      - /var/www/ecowater/mqtt/data:/mosquitto/data
      - /var/www/ecowater/mqtt/log:/mosquitto/log
    ports:
      - "1883:1883"
      - "8883:8883"
    networks:
      - ecowater_net

volumes:
  postgres_data:

networks:
  ecowater_net:
    driver: bridge
